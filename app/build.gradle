plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diettracker.v3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diettracker.v3'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '3.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
