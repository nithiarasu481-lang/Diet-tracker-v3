<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diet Tracker">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Tracker V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#151515;font-family:Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 3px 14px #0000000d}
h1{margin:0;font-size:27px}.muted{color:#777;font-size:13px;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.stat{background:#f6f6f6;padding:13px;border-radius:14px}.big{font-size:22px;font-weight:700;margin:5px 0}.bar{height:7px;background:#ddd;border-radius:9px;overflow:hidden}.fill{height:100%;background:#111;width:0}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:11px}.tab{padding:9px 13px;border:0;border-radius:20px;background:#e8e8e8;white-space:nowrap}.tab.active{background:#111;color:#fff}
.food{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.food:last-child{border:0}.food input{width:20px;height:20px}.foodmain{flex:1}.foodmain b{display:block}.details{font-size:12px;color:#777;margin-top:3px}.actions button{border:0;background:transparent;font-size:16px;cursor:pointer}
button{border:0;border-radius:11px;padding:10px 13px;background:#111;color:#fff;font-weight:600;cursor:pointer}.soft{background:#eee;color:#111}.danger{color:#b00020;background:#f8eaea}
form{display:grid;gap:8px}input,select{padding:11px;border:1px solid #ddd;border-radius:10px;width:100%;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.historyday{padding:11px 0;border-bottom:1px solid #eee}.historyday:last-child{border:0}.historytop{display:flex;justify-content:space-between;font-weight:700}.small{font-size:12px;color:#777}.progress{height:6px;background:#ddd;border-radius:9px;margin-top:7px}.progress div{height:100%;background:#111;border-radius:9px}
.empty{text-align:center;color:#777;padding:15px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Daily Diet Tracker</h1><div class="muted" id="today"></div>
<div class="stats">
<div class="stat">🔥 Calories<div class="big"><span id="cal">0</span> / <span id="ct">2500</span></div><div class="bar"><div class="fill" id="cb"></div></div><div class="small"><span id="cr">2500</span> kcal remaining</div></div>
<div class="stat">💪 Protein<div class="big"><span id="pro">0</span> / <span id="pt">120</span>g</div><div class="bar"><div class="fill" id="pb"></div></div><div class="small"><span id="pr">120</span>g remaining</div></div>
</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="card"><div id="foodList"></div></div>

<div class="card">
<div class="section-title"><b>Missing in this meal</b></div>
<div id="missing" class="empty">All done 🎉</div>
</div>

<div class="card">
<b>Add Food</b>
<form id="form" style="margin-top:10px">
<input id="name" placeholder="Food name" required>
<div class="grid2"><input id="qty" placeholder="Quantity" required><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></div>
<div class="grid2"><input id="protein" type="number" min="0" step=".1" placeholder="Protein (g)" required><input id="calories" type="number" min="0" placeholder="Calories (kcal)" required></div>
<button>Add Food</button>
</form>
</div>

<div class="card">
<b>Weekly Progress</b>
<div style="height:190px;margin-top:12px"><canvas id="chart" style="width:100%;height:100%"></canvas></div>
<div id="history" style="margin-top:8px"></div>
</div>

<div class="card">
<b>Weight Tracker</b>
<div class="grid2" style="margin-top:9px">
<input id="weight" type="number" min="0" step=".1" placeholder="Today's weight (kg)">
<button onclick="saveWeight()">Save Weight</button>
</div>
<div id="weightInfo" class="small" style="margin-top:9px"></div>
</div>

<div class="card">
<b>Consistency</b>
<div class="stats" style="margin-top:9px">
<div class="stat">🔥 Streak<div class="big"><span id="streak">0</span> days</div></div>
<div class="stat">📅 Tracked<div class="big"><span id="tracked">0</span> days</div></div>
</div>
<br><button class="soft" onclick="exportCSV()">Export CSV</button>
</div>

<div class="card">
<b>Targets</b>
<div class="grid2" style="margin-top:9px"><input id="targetCal" type="number" min="0"><input id="targetPro" type="number" min="0"></div>
<br><button onclick="saveTargets()">Save Targets</button>
<button class="soft" onclick="resetTicks()">Reset Today</button>
</div>
</div>

<script>
const KEY='dietTrackerV2';
const blank={targets:{cal:2500,pro:120},weights:{},foods:[
{name:'Egg',qty:'4 eggs',meal:'Breakfast',pro:24,cal:280},
{name:'Rice',qty:'300 g',meal:'Lunch',pro:7,cal:390},
{name:'Chicken',qty:'150 g',meal:'Lunch',pro:45,cal:250},
{name:'Milk',qty:'500 ml',meal:'Snacks',pro:16,cal:300},
{name:'Banana',qty:'1',meal:'Snacks',pro:1,cal:105}],days:{}};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||blank; data.weights=data.weights||{};
let selected='All';
const meals=['All','Breakfast','Lunch','Dinner','Snacks'];
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}
function getDay(k=dayKey()){if(!data.days[k])data.days[k]={checked:[]};return data.days[k]}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function renderTabs(){tabs.innerHTML=meals.map(m=>`<button class="tab ${selected===m?'active':''}" onclick="selected='${m}';render()">${m}</button>`).join('')}
function saveWeight(){
  const v=Number(weight.value);
  if(!v)return;
  data.weights[dayKey()]=v; save(); render();
}
function calcDay(k){
  const x=data.days[k]; if(!x)return {c:0,p:0,count:0};
  const foods=x.checked.map(i=>data.foods[i]).filter(Boolean);
  return {c:foods.reduce((s,f)=>s+Number(f.cal),0),p:foods.reduce((s,f)=>s+Number(f.pro),0),count:foods.length};
}
function calcStreak(){
  let s=0,d=new Date();
  while(true){const k=dayKey(d),x=data.days[k]; if(!x||!x.checked.length)break; s++; d.setDate(d.getDate()-1)}
  return s;
}
function drawChart(){
  const canvas=document.getElementById('chart'); if(!canvas)return;
  const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;
  canvas.width=rect.width*ratio; canvas.height=rect.height*ratio;
  const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);
  const W=rect.width,H=rect.height,pad=28;
  ctx.clearRect(0,0,W,H);ctx.strokeStyle='#ddd';ctx.fillStyle='#777';ctx.font='11px Arial';
  const vals=[],labels=[];
  for(let n=6;n>=0;n--){let d=new Date();d.setDate(d.getDate()-n);vals.push(calcDay(dayKey(d)).c);labels.push(d.toLocaleDateString(undefined,{weekday:'short'}))}
  const max=Math.max(data.targets.cal,...vals,1), plotW=W-pad*2,plotH=H-pad*2;
  ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,H-pad);ctx.lineTo(W-pad,H-pad);ctx.stroke();
  ctx.beginPath();vals.forEach((v,i)=>{const x=pad+i*plotW/6,y=H-pad-(v/max)*plotH;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
  vals.forEach((v,i)=>{const x=pad+i*plotW/6,y=H-pad-(v/max)*plotH;ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#777';ctx.fillText(labels[i],x-10,H-8);});
}
function render(){
today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
weight.value=data.weights[dayKey()]||''; streak.textContent=calcStreak();
tracked.textContent=Object.values(data.days).filter(d=>d&&d.checked&&d.checked.length).length;
const ws=Object.entries(data.weights).sort((a,b)=>a[0].localeCompare(b[0]));
weightInfo.textContent=ws.length?`Latest: ${ws[ws.length-1][1]} kg • First recorded: ${ws[0][1]} kg`:'No weight entries yet.';
ct.textContent=data.targets.cal;pt.textContent=data.targets.pro;targetCal.value=data.targets.cal;targetPro.value=data.targets.pro;
renderTabs();
let day=getDay(), list=data.foods.map((f,i)=>({...f,i})).filter(f=>selected==='All'||f.meal===selected);
foodList.innerHTML=list.length?'':'<div class="empty">No foods in this meal yet.</div>';
list.forEach(f=>{
let row=document.createElement('div');row.className='food';
row.innerHTML=`<input type="checkbox" ${day.checked.includes(f.i)?'checked':''}><div class="foodmain"><b>${f.name}</b><div class="details">${f.qty} • ${f.cal} kcal • ${f.pro}g protein</div></div><div class="actions"><button title="Edit">✏️</button><button title="Delete">🗑️</button></div>`;
row.querySelector('input').onchange=e=>{if(e.target.checked){if(!day.checked.includes(f.i))day.checked.push(f.i)}else day.checked=day.checked.filter(x=>x!==f.i);save();render()};
let bs=row.querySelectorAll('button');bs[0].onclick=()=>editFood(f.i);bs[1].onclick=()=>deleteFood(f.i);foodList.appendChild(row);
});
let eaten=day.checked.map(i=>data.foods[i]).filter(Boolean),c=eaten.reduce((s,f)=>s+Number(f.cal),0),p=eaten.reduce((s,f)=>s+Number(f.pro),0);
cal.textContent=c;pro.textContent=p;cr.textContent=Math.max(0,data.targets.cal-c);pr.textContent=Math.max(0,data.targets.pro-p);
cb.style.width=Math.min(100,c/data.targets.cal*100)+'%';pb.style.width=Math.min(100,p/data.targets.pro*100)+'%';
let miss=list.filter(f=>!day.checked.includes(f.i));missing.innerHTML=miss.length?miss.map(f=>`• ${f.name} — ${f.pro}g protein, ${f.cal} kcal`).join('<br>'):'All done 🎉';
renderHistory(); drawChart();
}
form.onsubmit=e=>{e.preventDefault();data.foods.push({name:name.value,qty:qty.value,meal:meal.value,pro:Number(protein.value),cal:Number(calories.value)});save();form.reset();render()};
function editFood(i){let f=data.foods[i],n=prompt('Food name:',f.name);if(n===null)return;let q=prompt('Quantity:',f.qty);if(q===null)return;let p=prompt('Protein (g):',f.pro);if(p===null)return;let c=prompt('Calories:',f.cal);if(c===null)return;f.name=n;f.qty=q;f.pro=Number(p);f.cal=Number(c);save();render()}
function deleteFood(i){if(!confirm('Delete '+data.foods[i].name+'?'))return;data.foods.splice(i,1);Object.values(data.days).forEach(d=>d.checked=d.checked.filter(x=>x!==i).map(x=>x>i?x-1:x));save();render()}
function saveTargets(){data.targets={cal:Number(targetCal.value),pro:Number(targetPro.value)};save();render()}
function resetTicks(){getDay().checked=[];save();render()}
function exportCSV(){
  let rows=[['Date','Calories','Protein(g)','Foods checked','Weight(kg)']];
  for(let n=6;n>=0;n--){let d=new Date();d.setDate(d.getDate()-n);let k=dayKey(d),x=calcDay(k);rows.push([k,x.c,x.p,x.count,data.weights[k]||''])}
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='diet-history.csv';a.click();URL.revokeObjectURL(a.href);
}
function renderHistory(){
let out='',now=new Date();
for(let n=0;n<7;n++){let d=new Date(now);d.setDate(now.getDate()-n);let k=dayKey(d),x=data.days[k];if(!x){continue}let foods=x.checked.map(i=>data.foods[i]).filter(Boolean),c=foods.reduce((s,f)=>s+Number(f.cal),0),p=foods.reduce((s,f)=>s+Number(f.pro),0);out+=`<div class="historyday"><div class="historytop"><span>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span><span>${c} kcal</span></div><div class="small">${p}g protein • ${foods.length} foods</div><div class="progress"><div style="width:${Math.min(100,c/data.targets.cal*100)}%"></div></div></div>`}
history.innerHTML=out||'<div class="empty">History will appear as you track your days.</div>';
}
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
